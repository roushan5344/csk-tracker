name: csk-tracker
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub's fastest reliable interval; may lag a few minutes
  workflow_dispatch:
concurrency: csk-tracker
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6            # keeps state.db so you never get repeat alerts
        with:
          path: state.db
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python tracker.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # The dashboard this run wrote becomes the GitHub Pages site. A failed job doesn't save state.db to the
      # cache, so the next run would repeat these alerts: that's why a Pages problem must never fail this job.
      - run: mkdir site && cp dashboard.html site/index.html
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v5
        continue-on-error: true
        with:
          path: site
  pages:                                  # https://roushan5344.github.io/csk-tracker/
    needs: run
    runs-on: ubuntu-latest
    permissions:                          # only this job gets them; it never sees the Telegram secrets
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
