name: csk-tracker
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub's fastest reliable interval; may lag a few minutes
  workflow_dispatch:
concurrency: csk-tracker
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6            # keeps state.db so you never get repeat alerts
        with:
          path: state.db
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python tracker.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
